<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in · Baik</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F3F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAEBED;--card:#FFFFFF;--ink:#16181C;--muted:#5D636D;--soft:#8A9099;--line:#DCDEE2;--chip:#F3F3F3;--sage:#E7F1EA;--sage-ink:#3E6B52;--bad:#8A2B2B;--bad-bg:#FBEAEA}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Saira,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;padding:22px 38px}
.logo{font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
main{flex:1;display:grid;place-items:center;padding:16px}
.card{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 32px 26px;box-shadow:0 30px 60px -40px rgba(20,24,30,.35)}
.bis{font-family:Amiri,serif;font-size:22px;color:var(--muted);text-align:center;direction:rtl;margin-bottom:12px}
.k{font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-ink)}
h1{font-size:27px;line-height:1.15;margin:8px 0 6px;letter-spacing:-.015em}
.p{color:var(--muted);margin:0 0 20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:999px;padding:4px;margin-bottom:20px}
.seg button{border:0;background:none;border-radius:999px;padding:9px;font:600 14px Saira,sans-serif;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-weight:600;font-size:13.5px;margin:0 0 6px}
.f{margin-bottom:14px}
.in{position:relative}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:15px Saira,sans-serif;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--sage-ink);box-shadow:0 0 0 3px var(--sage)}
input[aria-invalid="true"]{border-color:var(--bad)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font:600 12.5px Saira,sans-serif;padding:6px 8px;cursor:pointer;border-radius:8px}
.hint{font-size:12.5px;color:var(--soft);margin-top:5px}
.go{width:100%;margin-top:6px;padding:13px 16px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:600 15px Saira,sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s}
.go:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.go:disabled{opacity:.6;cursor:wait;transform:none}
.go:focus-visible,.seg button:focus-visible,.eye:focus-visible{outline:2px solid var(--sage-ink);outline-offset:2px}
.swap{font-size:13.5px;color:var(--muted);margin:16px 0 0;text-align:center}
.swap a{color:var(--sage-ink);font-weight:600}
.msg{display:none;margin-bottom:14px;padding:10px 14px;border-radius:12px;font-size:13.5px}
.msg.bad{display:block;background:var(--bad-bg);color:var(--bad)}
.msg.ok{display:block;background:var(--sage);color:var(--sage-ink)}
footer{text-align:center;color:var(--soft);font-size:12.5px;padding:20px 16px 28px}
@media (max-width:520px){.top{padding:18px 16px}.card{padding:24px 20px 20px;border-radius:20px}h1{font-size:24px}}

/* the Baik logo (assets/logo/baik-logo_caps-black.png): its shape used as a mask, filled with currentColor, so it takes any ink */
.baik-logo{display:inline-block;vertical-align:middle;height:1em;aspect-ratio:118.13/45.82;background:currentColor;
 -webkit-mask:url("assets/logo/baik-logo_caps-black.png") center/108% 120.7% no-repeat;mask:url("assets/logo/baik-logo_caps-black.png") center/108% 120.7% no-repeat;}
.logo .baik-logo{height:30px;}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/login.html"><span class="baik-logo" role="img" aria-label="Baik"></span></a></header>
<main>
  <section class="card" aria-labelledby="h">
    <div class="bis" lang="ar">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <div class="k" id="kicker">Welcome back</div>
    <h1 id="h">Sign in to Baik</h1>
    <p class="p" id="lede">Sign in to open the dua catalogue, your saved cards and your notes.</p>
    <div class="seg" role="tablist" aria-label="Sign in or create account">
      <button type="button" role="tab" id="tIn" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tUp" aria-selected="false">Create account</button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
    <form id="form" novalidate>
      <div class="f" id="nameRow" hidden>
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" maxlength="60">
      </div>
      <div class="f">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>
      </div>
      <div class="f">
        <label for="pw">Password</label>
        <div class="in">
          <input id="pw" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
          <button type="button" class="eye" id="eye" aria-controls="pw" aria-pressed="false">Show</button>
        </div>
        <div class="hint" id="pwHint" hidden>At least 8 characters.</div>
      </div>
      <button class="go" id="go" type="submit">Sign in</button>
    </form>
    <p class="swap" id="swap">New to Baik? <a href="#" id="swapA">Create an account</a></p>
  </section>
</main>
<footer>© Baik · The right dua for what you are facing</footer>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), next = q.get('next') || '/Khayr.html';
  if (!/^\/(?!\/)/.test(next) || next.indexOf('/login') === 0 || next.indexOf('/api') === 0) next = '/Khayr.html';
  var up = false, busy = false;

  function say(text, ok) { var m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (text ? ok ? ' ok' : ' bad' : ''); }
  function mode(u) {
    up = u; say('');
    $('tIn').setAttribute('aria-selected', !up); $('tUp').setAttribute('aria-selected', up);
    $('kicker').textContent = up ? 'Create account' : 'Welcome back';
    $('h').textContent = up ? 'Create your Baik account' : 'Sign in to Baik';
    $('lede').textContent = up ? 'Free to join. Your saved cards and notes follow you once you are signed in.' : 'Sign in to open the dua catalogue, your saved cards and your notes.';
    $('nameRow').hidden = !up; $('pwHint').hidden = !up;
    $('pw').autocomplete = up ? 'new-password' : 'current-password';
    $('go').textContent = up ? 'Create account' : 'Sign in';
    $('swap').innerHTML = up ? 'Already have an account? <a href="#" id="swapA">Sign in</a>' : 'New to Baik? <a href="#" id="swapA">Create an account</a>';
    $('swapA').addEventListener('click', function (e) { e.preventDefault(); mode(!up); });
    (up ? $('name') : $('email')).focus();
  }
  $('tIn').addEventListener('click', function () { mode(false); });
  $('tUp').addEventListener('click', function () { mode(true); });
  $('swapA').addEventListener('click', function (e) { e.preventDefault(); mode(true); });
  $('eye').addEventListener('click', function () {
    var show = $('pw').type === 'password'; $('pw').type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show'; this.setAttribute('aria-pressed', show);
  });
  if (q.get('mode') === 'signup') mode(true);
  if (q.get('out') === '1') say('You are signed out.', true);

  function invalid(id, text) { $(id).setAttribute('aria-invalid', 'true'); $(id).focus(); say(text); return false; }
  function check() {
    ['name', 'email', 'pw'].forEach(function (id) { $(id).removeAttribute('aria-invalid'); });
    if (up && !$('name').value.trim()) return invalid('name', 'Please enter your name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('email').value.trim())) return invalid('email', 'Please enter a valid email address.');
    if ($('pw').value.length < 8) return invalid('pw', up ? 'Your password needs at least 8 characters.' : 'Please enter your password.');
    return true;
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy || !check()) return;
    busy = true; say(''); $('go').disabled = true; $('go').textContent = up ? 'Creating account…' : 'Signing in…';
    var body = { email: $('email').value.trim(), password: $('pw').value };
    if (up) body.name = $('name').value.trim();
    fetch('/api/auth/' + (up ? 'register' : 'login'), {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
    }).then(function (x) {
      if (x.ok) {
        // a fresh sign-in opens the app on the card grid (the app keeps its view under baik.view)
        try { localStorage.setItem('baik.view', JSON.stringify('grid')); } catch (err) {}
        location.replace(next); return;
      }
      // 404 / 405 / 501: this address serves files only (e.g. python -m http.server), with no sign-in behind it
      if (x.status === 404 || x.status === 405 || x.status === 501 || !x.d || (!x.d.error && !x.ok)) say('Sign-in is not running at this address. On your computer, open Baik at localhost:4280 (started with: node api/dev-server.js).');
      else say(x.d.error || 'Something went wrong. Please try again.');
    }).catch(function () {
      say('Could not reach Baik. Check your connection and try again.');
    }).then(function () { busy = false; $('go').disabled = false; $('go').textContent = up ? 'Create account' : 'Sign in'; });
  });

  // already signed in: go straight to the app
  fetch('/api/auth/me', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.user) location.replace(next); }).catch(function () {});
})();
</script>
</body>
</html>
